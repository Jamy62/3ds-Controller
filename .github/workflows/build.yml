name: Build 3DSX
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile 3DSX
        run: PATH=$PATH:/opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin make
      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: 3ds_controller
          path: "*.3dsx"
